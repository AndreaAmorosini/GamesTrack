    <!-- Installazione come web app su iOS (home screen) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GamesTrack" />
    <!-- Installazione come web app su Android/desktop (Chrome, Edge) -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="GamesTrack" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!-- Font di sistema: nessuna dipendenza esterna (Google Fonts) per l'uso via Tailscale/offline -->
    <title>GamesTrack</title>
